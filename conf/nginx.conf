# ICS calendar feed.
#
# YunoHost lets visitors reach this path without logging in (see the "ics"
# permission in manifest.toml), so that calendar apps can subscribe to it.
# MoreLater has no authentication of its own, so the feed is gated here
# instead: a request must carry the secret token generated at install time,
# as ?token=... in the URL. Anything else gets a plain 404, which avoids
# confirming to a stranger that the feed exists.
#
# This is deliberately a prefix match rather than an exact one (`location =`).
# YunoHost's SSO treats every URL that *starts with* /api/calendar.ics as
# public, so every such URL must pass through this token check too.
#
# The `if` runs in nginx's rewrite phase, before the SSO check, and uses only
# `return`, which is the one safe use of `if` inside a location block.
location __PATH__/api/calendar.ics {
    if ($arg_token != "__ICS_TOKEN__") {
        return 404;
    }

    proxy_pass http://127.0.0.1:__PORT__;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
    proxy_buffering off;
}

#sub_path_only rewrite ^__PATH__$ __PATH__/ permanent;
location __PATH__/ {

    proxy_pass http://127.0.0.1:__PORT__;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket support
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_redirect off;
    proxy_buffering off;

    client_max_body_size 50M;

    # Include SSOWAT panel
    more_clear_input_headers 'Accept-Encoding';
    include conf.d/yunohost_panel.conf.inc;
}
